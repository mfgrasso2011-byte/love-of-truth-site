<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sermons | Love of Truth</title>
    <meta
      name="description"
      content="Listen to sermons by Michael Grasso, organized by book of the Bible and date."
    />
    <link rel="icon" type="image/png" href="References/Full%20logo%20no%20text,%20transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Love of Truth home">
          <img class="brand-logo" src="References/Full%20logo%20no%20text,%20transparent.png" alt="Love of Truth" />
          <span class="brand-text">Love of Truth</span>
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <div class="nav-dropdown">
            <a href="books.html">Books</a>
            <div class="nav-dropdown-menu" aria-label="Book links">
              <a href="sailing-to-chayah.html">Sailing to Chayah: A Desperate Journey</a>
              <a href="his-kingdom.html">His Kingdom Shall Never End</a>
            </div>
          </div>
          <a href="teaching.html">Teaching</a>
          <a href="sermons.html" aria-current="page">Sermons</a>
          <a href="contact.html">Contact</a>
        </nav>

        <div class="header-actions" aria-label="Account and cart shortcuts">
          <a class="cart-link" href="cart.html" aria-label="Cart">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 18a2 2 0 1 0 2 2 2 2 0 0 0-2-2Zm10 0a2 2 0 1 0 2 2 2 2 0 0 0-2-2ZM6.2 6l.6 3h11.7l1.4-5H5.6L5 1H1v2h2.4l2.2 11.2A2 2 0 0 0 7.6 16H19v-2H7.6l-.3-1.5h10.9a2 2 0 0 0 1.9-1.4L22 4.4A1 1 0 0 0 21 3H6.1Z" />
            </svg>
            <span class="cart-count" data-cart-count>0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="sermons-page" data-sermons-page>
      <section class="sermons-hero" aria-labelledby="sermons-title">
        <div class="container sermons-hero-inner">
          <span class="sermons-title-rule" aria-hidden="true"></span>
          <p class="sermons-kicker">Preaching Christ from all of Scripture</p>
          <h1 id="sermons-title">Sermons</h1>
          <p class="sermons-byline">Rev. Michael Grasso</p>
        </div>
      </section>

      <section class="sermon-browser" aria-label="Sermon archive">
        <div class="container">
          <div class="sermon-toolbar">
            <div class="sermon-view-tabs" role="tablist" aria-label="Browse sermons">
              <button class="sermon-tab is-active" type="button" role="tab" aria-selected="true" data-sermon-view="books">
                <span aria-hidden="true">▤</span> Books
              </button>
              <button class="sermon-tab" type="button" role="tab" aria-selected="false" data-sermon-view="latest">
                <span aria-hidden="true">◷</span> Latest
              </button>
            </div>

            <label class="sermon-search">
              <span class="sr-only">Search sermons</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 20-5.2-5.2a7.5 7.5 0 1 0-1 1L20 21ZM5.5 10a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0Z" /></svg>
              <input type="search" placeholder="Search title, book, or description" data-sermon-search />
            </label>

            <label class="sermon-year-filter">
              <span>Year</span>
              <select data-sermon-year><option value="">All years</option></select>
            </label>
          </div>

          <p class="sermon-status" data-sermon-status role="status" aria-live="polite">Loading sermons…</p>
          <div class="sermon-book-index" data-sermon-book-index></div>
          <div class="sermon-results" data-sermon-results hidden></div>
          <div class="sermon-empty" data-sermon-empty hidden>No sermons match those filters.</div>
        </div>
      </section>
    </main>

    <template id="sermon-card-template">
      <article class="sermon-card">
        <div class="sermon-card-date" data-date></div>
        <div class="sermon-card-copy">
          <p class="sermon-card-book" data-book></p>
          <h2 data-title></h2>
          <p class="sermon-card-description" data-description></p>
          <p class="sermon-card-speaker">Rev. Michael Grasso</p>
        </div>
        <div class="sermon-card-actions">
          <audio controls preload="none" data-audio></audio>
          <button class="sermon-watch-button" type="button" data-video>
            <span aria-hidden="true">▶</span> Watch sermon
          </button>
          <div class="sermon-card-links">
            <a data-youtube target="_blank" rel="noreferrer">YouTube ↗</a>
            <a data-source target="_blank" rel="noreferrer">Church page ↗</a>
          </div>
        </div>
      </article>
    </template>

    <dialog class="video-dialog" data-video-dialog aria-labelledby="video-dialog-title">
      <div class="video-dialog-bar">
        <h2 id="video-dialog-title" data-video-dialog-title>Sermon video</h2>
        <button type="button" data-video-dialog-close aria-label="Close video">&times;</button>
      </div>
      <div class="video-player-frame" data-video-player></div>
    </dialog>

    <script src="script.js"></script>
    <script src="sermons.js"></script>
  </body>
</html>
